; Beese's Poker Lounge - platform settings.
;
; The game reads config.ini next to its binary (the build copies this file
; there), or the file given with --config. Anything missing here falls back to
; the built-in defaults, which are the values below. Command-line options
; override this file. Comments start with ';' or '#'.

[input]
; Each logical button takes up to 6 physical inputs, separated by commas.
; A line replaces that button's defaults completely; NONE unbinds it.
;
;   KEY_<name>            keyboard: KEY_A..KEY_Z, KEY_0..KEY_9 (or KEY_ONE..),
;                         KEY_F1..KEY_F12, KEY_ENTER, KEY_SPACE, KEY_ESCAPE,
;                         KEY_BACKSPACE, KEY_TAB, KEY_INSERT, KEY_DELETE,
;                         KEY_HOME, KEY_END, KEY_PAGE_UP, KEY_PAGE_DOWN,
;                         KEY_UP/DOWN/LEFT/RIGHT, KEY_LEFT_SHIFT/CONTROL/ALT,
;                         KEY_RIGHT_SHIFT/CONTROL/ALT, KEY_KP_0..KEY_KP_9,
;                         KEY_KP_ENTER, and punctuation (KEY_COMMA, ...)
;   JOY<n>_B<k>           joystick n (0 = first found), button k
;   JOY<n>_AXIS<k>+ / -   axis k pushed past half way in that direction
;   JOY<n>_HAT<k>_UP      hat k direction (UP, DOWN, LEFT, RIGHT)
;   JOY*_...              the same on any joystick
;
; Joystick buttons, axes and hats are numbered as SDL numbers them, which is
; what EmulationStation writes to ~/.emulationstation/es_input.cfg: a line
; <input name="start" type="button" id="9"/> there is JOY0_B9 here. Arcade
; encoders that report generic joystick buttons (BTN_TRIGGER..) work, which
; raylib's own gamepad support does not handle.
;
; The arcade panel's buttons are NOT listed here: [panel] below says which
; encoder input is in which panel position, and the game lays its buttons out
; by position. The lines here are the keyboard (and the sticks), and anything
; you add to them. A JOY binding may end in @<seconds>: it then counts only
; once held that long (e.g. JOY1_B9@3).

HOLD1    = KEY_ONE, KEY_Z
HOLD2    = KEY_TWO, KEY_X
HOLD3    = KEY_THREE, KEY_C
HOLD4    = KEY_FOUR, KEY_V
HOLD5    = KEY_FIVE, KEY_B
DEAL     = KEY_ENTER, KEY_SPACE, KEY_KP_ENTER
BET_ONE  = KEY_A
BET_MAX  = KEY_S
CASH_OUT = KEY_Q
SERVICE  = KEY_F2, KEY_NINE

; Menu navigation (service menu, game select, Hold'em bet slider steps).
UP       = KEY_UP, JOY*_AXIS1-, JOY*_HAT0_UP
DOWN     = KEY_DOWN, JOY*_AXIS1+, JOY*_HAT0_DOWN
LEFT     = KEY_LEFT, JOY*_AXIS0-, JOY*_HAT0_LEFT
RIGHT    = KEY_RIGHT, JOY*_AXIS0+, JOY*_HAT0_RIGHT
OK       = KEY_ENTER, KEY_SPACE
BACK     = KEY_BACKSPACE

COIN     = KEY_INSERT
START    = KEY_HOME
DEBUG    = KEY_F1                 ; toggles the debug overlay

; Leaving the game (back to EmulationStation): any EXIT input, or all the
; logical buttons of EXIT_COMBO held at once. COIN+START matches RetroPie's
; select+start hotkey exit on this cabinet.
EXIT       = KEY_ESCAPE
EXIT_COMBO = COIN+START

; Hold'em bet slider from an analogue axis (JOY<n>_AXIS<k>, no sign), or NONE.
SLIDER   = NONE

; Touchscreen (or mouse on the desktop): taps map into the 1280x720 play space.
TOUCH    = on

[panel]
; Which encoder input is in which position of the panel. Per side (player 1
; on the left, player 2 on the right): T1 T2 T3 is the top row left to right,
; B1 B2 B3 the bottom row, then SELECT and START. The game lays its buttons
; out by position:
;
;          P1 side                         P2 side
;   top:   HOLD 1   HOLD 2   HOLD 3    |   HOLD 4   HOLD 5   DEAL / DRAW
;   bot:   CASH OUT BET ONE  BET MAX   |   -        -        DEAL / DRAW
;          SELECT = COIN, START        |   SELECT = COIN, START held 3 s = SERVICE
;
; (in Hold'em: HOLD 1 fold, HOLD 2 check/call, HOLD 3-5 raise 1/2, 3/4, 1x
; pot, BET MAX all-in, BET ONE +1 big blind, DEAL bet/raise the amount shown).
;
; The values below are a guess: RetroPie's usual 6-button layout, Y X L over
; B A R, in EmulationStation's numbering (x=0 a=1 b=2 y=3 L=4 R=5 select=8
; start=9), player 1 = the first joystick found. The easy way to get them
; right is LEARN PANEL in the service menu (the game also offers it on its
; first start): it asks for each position in turn and saves the answer to
; panel.ini in the save directory, which then wins over these lines.
; NONE = no button in that position.
P1_T1     = JOY0_B3
P1_T2     = JOY0_B0
P1_T3     = JOY0_B4
P1_B1     = JOY0_B2
P1_B2     = JOY0_B1
P1_B3     = JOY0_B5
P1_SELECT = JOY0_B8
P1_START  = JOY0_B9
P2_T1     = JOY1_B3
P2_T2     = JOY1_B0
P2_T3     = JOY1_B4
P2_B1     = JOY1_B2
P2_B2     = JOY1_B1
P2_B3     = JOY1_B5
P2_SELECT = JOY1_B8
P2_START  = JOY1_B9

[display]
; size: native = the display's preferred mode (DRM), or WxH. On the desktop
; the window is 1280x720 unless set here or with --size.
size     = native
; scale: auto = whole-number scale when it fills >= 90% of a fractional fit
;        (3440x1440 -> 2x = 2560x1440), else fractional 16:9 fit;
;        integer | fit | 1x force one behaviour.
scale    = auto
; filter: auto = point at whole-number scales, bilinear otherwise; point | bilinear.
filter   = auto
; present: how the play space reaches the display.
;   plane = the Pi's display controller scales it at scan-out, over a static
;           background plane with the side art; costs the GPU nothing (DRM only)
;   gpu   = the GPU draws side art + scaled play space every frame (~15.5 ms
;           of GPU time per frame at 3440x1440 on the Pi 4)
;   auto  = plane when the driver offers it, else gpu (the desktop is always gpu)
present  = auto
; side_art: on = the side-art hook fills the margins (honeycomb placeholder).
side_art = on
; vsync: desktop only; on the Pi every frame waits for the vblank.
vsync    = on

[effects]
; Every effect can be switched off, to measure what it costs or to calm the
; machine down (on | off). The F1 overlay lists them: UPPER CASE = on.
; --fx on the command line overrides these, e.g. --fx bloom=off,shake=off
bloom           = on
particles       = on
shake           = on
hitpause        = on
marquee_flicker = on
bulb_chase      = on
shimmer         = on
card_specular   = on

[debug]
; overlay: on = start with the F1 overlay visible.
overlay  = off

[game]
; save_dir: where credits, statistics and settings are kept (state.sav, its
; backup state.sav.bak) and the hand log (hands.log). Default:
; $XDG_DATA_HOME/beese-poker, else ~/.local/share/beese-poker - on a Pi that
; is the SD card's ext4 root filesystem, where fsync and rename are reliable.
; Do not point it at the RetroPie ROM stick: it is vfat, whose rename and
; fsync give no power-cut guarantees. If the directory cannot be written the
; game runs from RAM and the service menu shows a warning. '~' is expanded.
;save_dir = ~/.local/share/beese-poker
; assets_dir: sfx/ and music/. Default: assets/ next to the binary, or found
; by walking up from it (the build tree).
;assets_dir = /opt/beese-poker/assets
; hand_log: one line per hand (time, mode, seed, result) in save_dir/hands.log.
hand_log = on
